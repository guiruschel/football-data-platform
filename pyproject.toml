[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "football-data-platform"
version = "0.1.0"
description = "End-to-end Data Engineering platform using Premier League data"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "sqlfluff>=3.0",
    "pre-commit>=3.7",
    "great-expectations>=0.18",
    "dbt-postgres>=1.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["ingestion/src"]
